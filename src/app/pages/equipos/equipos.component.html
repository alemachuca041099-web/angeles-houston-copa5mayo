<app-page-header
  [kicker]="i18n.t('equipos.header.kicker')"
  [title]="i18n.t('equipos.header.title')"
  [subtitle]="i18n.t('equipos.header.subtitle')"
></app-page-header>

@if (teams.length > 0) {
  <section class="section">
    <div class="container teams-grid">
      @for (team of teams; track team.id; let i = $index) {
        <div appReveal="fade-up" [revealDelay]="(i % 4) * 90">
          <app-team-card [team]="team"></app-team-card>
        </div>
      }
    </div>
  </section>
} @else {
  <section class="section">
    <div class="container">
      <div class="waiting" appReveal="zoom-in">
        <span class="kicker">{{ i18n.t('equipos.waiting.kicker') }}</span>
        <h2 [innerHTML]="i18n.t('equipos.waiting.title')"></h2>
        <p [innerHTML]="i18n.t('equipos.waiting.body')"></p>

        <app-countdown [targetDate]="sorteoDate"></app-countdown>

        <div class="waiting__actions">
          <a routerLink="/torneos" class="btn btn-primary">{{ i18n.t('tabla.cta') }}</a>
          <a routerLink="/contacto" class="btn btn-outline">{{ i18n.t('partidos.cta2') }}</a>
        </div>
      </div>
    </div>
  </section>
}
